name: Stage MCP server on npm

on:
  push:
    tags:
      - 'mcp-*.*.*'

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  publish-mcp:
    name: Test and publish keen-pbr-mcp
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: mcp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check tag matches package.json version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#mcp-}"
          if ! [[ "$tag" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not mcp-<semver>"
            exit 1
          fi
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag version $tag does not match mcp/package.json version $pkg"
            exit 1
          fi
          # Pre-releases (1.2.3-beta.1) go to the "next" dist-tag, not "latest".
          if [[ "$tag" == *-* ]]; then
            echo "dist_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      # Trusted publishing needs npm >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # The trusted publisher only has the "stage publish" permission: the
      # version is staged here and published after approval (with 2FA) via
      # `npm stage approve <stage-id>` or on npmjs.com.
      - name: Stage package on npm
        run: npm stage publish --ignore-scripts --access public --tag "${{ steps.version.outputs.dist_tag }}"
