name: Build packages

on:
  push:
    branches:
      - 'main'
      - 'dev'
      - 'dev-*'
      - 'feature/*'
    paths:
      - 'build_scripts/**'
      - 'cmake/**'
      - 'docker/**'
      - 'frontend/**'
      - 'include/**'
      - 'packages/**'
      - 'src/**'
      - 'tests/**'
      - 'third_party/**'
      - 'CMakeLists.txt'
      - 'Makefile'
      - 'version.mk'
  pull_request:
  workflow_dispatch:
    inputs:
      build_scope:
        description: Package target set
        required: true
        default: default
        type: choice
        options:
          - default
          - full

jobs:
  prepare-frontend:
    runs-on: ubuntu-latest
    outputs:
      target_root: ${{ steps.context.outputs.target_root }}
      use_signing_secrets: ${{ steps.context.outputs.use_signing_secrets }}
      allow_publish: ${{ steps.context.outputs.allow_publish }}
      source_ref_type: ${{ steps.context.outputs.source_ref_type }}
      source_ref_name: ${{ steps.context.outputs.source_ref_name }}
      source_pr_number: ${{ steps.context.outputs.source_pr_number }}
      build_scope: ${{ steps.context.outputs.build_scope }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Derive workflow context
        id: context
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO_FULL_NAME: ${{ github.event.pull_request.head.repo.full_name }}
          REQUESTED_SCOPE: ${{ inputs.build_scope || 'default' }}
        run: |
          set -euo pipefail

          target_root="$REF_NAME"
          use_signing_secrets=false
          allow_publish=false
          source_ref_type=branch
          source_ref_name="$REF_NAME"
          source_pr_number=
          build_scope=default

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$REQUESTED_SCOPE" = "full" ]; then
            build_scope=full
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            target_root="pr/$PR_NUMBER"
            source_ref_name="$PR_HEAD_REF"
            source_pr_number="$PR_NUMBER"
            if [ "$PR_HEAD_REPO_FULL_NAME" = "$REPOSITORY" ]; then
              use_signing_secrets=true
            fi
          elif [[ "$REF" == refs/heads/* ]]; then
            use_signing_secrets=true
            allow_publish=true
          fi

          echo "target_root=$target_root" >> "$GITHUB_OUTPUT"
          echo "use_signing_secrets=$use_signing_secrets" >> "$GITHUB_OUTPUT"
          echo "allow_publish=$allow_publish" >> "$GITHUB_OUTPUT"
          echo "source_ref_type=$source_ref_type" >> "$GITHUB_OUTPUT"
          echo "source_ref_name=$source_ref_name" >> "$GITHUB_OUTPUT"
          echo "source_pr_number=$source_pr_number" >> "$GITHUB_OUTPUT"
          echo "build_scope=$build_scope" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
      - name: Build frontend bundles
        run: |
          set -euo pipefail
          for platform in generic openwrt keenetic; do
            make frontend-build FRONTEND_PLATFORM="$platform"
            rm -rf "$GITHUB_WORKSPACE/frontend-artifact-$platform"
            mkdir -p "$GITHUB_WORKSPACE/frontend-artifact-$platform"
            cp -a "$GITHUB_WORKSPACE/frontend/dist"/. "$GITHUB_WORKSPACE/frontend-artifact-$platform"/
          done

      - name: Upload frontend bundle (generic)
        uses: actions/upload-artifact@v6
        with:
          name: frontend-dist-generic
          path: frontend-artifact-generic
          include-hidden-files: true

      - name: Upload frontend bundle (openwrt)
        uses: actions/upload-artifact@v6
        with:
          name: frontend-dist-openwrt
          path: frontend-artifact-openwrt
          include-hidden-files: true

      - name: Upload frontend bundle (keenetic)
        uses: actions/upload-artifact@v6
        with:
          name: frontend-dist-keenetic
          path: frontend-artifact-keenetic
          include-hidden-files: true

  bootstrap-publish:
    name: Prepare branch repository
    needs: [prepare-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        if: ${{ needs.prepare-frontend.outputs.allow_publish == 'true' }}
        with:
          submodules: recursive
      - name: Bootstrap immutable release directory
        if: ${{ needs.prepare-frontend.outputs.allow_publish == 'true' }}
        env:
          RSYNC_HOST: ${{ secrets.RSYNC_HOST || vars.RSYNC_HOST }}
          RSYNC_USERNAME: ${{ secrets.RSYNC_USERNAME || vars.RSYNC_USERNAME }}
          RSYNC_SSH_PRIVATE_KEY: ${{ secrets.RSYNC_SSH_PRIVATE_KEY || vars.RSYNC_SSH_PRIVATE_KEY }}
          RSYNC_TARGET_ROOT: ${{ secrets.RSYNC_TARGET_ROOT || vars.RSYNC_TARGET_ROOT }}
          RSYNC_PORT: ${{ secrets.RSYNC_PORT || vars.RSYNC_PORT || '22' }}
        run: |
          bash build_scripts/bootstrap-rsync-release.sh \
            branch \
            "${{ needs.prepare-frontend.outputs.source_ref_name }}" \
            "${{ needs.prepare-frontend.outputs.source_pr_number }}"

  openwrt-matrix:
    needs: [prepare-frontend]
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - name: Resolve OpenWrt matrix
        id: matrix
        env:
          BUILD_SCOPE: ${{ needs.prepare-frontend.outputs.build_scope }}
        run: |
          set -euo pipefail
          if [ "$BUILD_SCOPE" = "full" ]; then
            matrix="$(python3 .github/builder/extract_release_openwrt_matrix.py)"
          else
            matrix='[{"openwrt_version":"25.12.2","architecture":"aarch64_cortex-a53"}]'
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Selected OpenWrt matrix: $matrix"

  openwrt:
    needs: [prepare-frontend, bootstrap-publish, openwrt-matrix]
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJson(needs.openwrt-matrix.outputs.matrix) }}
    uses: ./.github/workflows/reusable-openwrt-packages.yml
    with:
      openwrt_version: ${{ matrix.build.openwrt_version }}
      architecture: ${{ matrix.build.architecture }}
      frontend_artifact_name: frontend-dist-openwrt
      use_signing_secrets: ${{ needs.prepare-frontend.outputs.use_signing_secrets == 'true' }}
      publish_branch: ${{ needs.prepare-frontend.outputs.allow_publish == 'true' }}
      source_ref_name: ${{ needs.prepare-frontend.outputs.source_ref_name }}
    secrets: inherit

  keenetic:
    needs: [prepare-frontend, bootstrap-publish]
    uses: ./.github/workflows/reusable-keenetic-packages.yml
    with:
      build_scope: ${{ needs.prepare-frontend.outputs.build_scope }}
      keenetic_version: current
      frontend_artifact_name: frontend-dist-keenetic
      publish_branch: ${{ needs.prepare-frontend.outputs.allow_publish == 'true' }}
      source_ref_name: ${{ needs.prepare-frontend.outputs.source_ref_name }}
    secrets: inherit

  debian:
    needs: [prepare-frontend, bootstrap-publish]
    uses: ./.github/workflows/reusable-deb-packages.yml
    with:
      build_scope: ${{ needs.prepare-frontend.outputs.build_scope }}
      frontend_artifact_name: frontend-dist-generic
      use_signing_secrets: ${{ needs.prepare-frontend.outputs.use_signing_secrets == 'true' }}
      publish_branch: ${{ needs.prepare-frontend.outputs.allow_publish == 'true' }}
      source_ref_name: ${{ needs.prepare-frontend.outputs.source_ref_name }}
    secrets: inherit
