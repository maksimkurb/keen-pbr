name: Reusable repository publisher

on:
  workflow_call:
    inputs:
      target_root:
        required: true
        type: string
      source_ref_type:
        required: true
        type: string
      source_ref_name:
        required: true
        type: string
      source_pr_number:
        required: false
        default: ""
        type: string
      source_run_id:
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      target_root:
        description: "Target root directory in repository"
        required: true
        type: string
      source_ref_type:
        description: "Source reference type (branch, tag, pr)"
        required: true
        type: string
      source_ref_name:
        description: "Source reference name"
        required: true
        type: string
      source_pr_number:
        description: "Source PR number (if ref type is pr)"
        required: false
        default: ""
        type: string
      source_run_id:
        description: "Run ID of the workflow that produced the artifacts"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          path: src

      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ inputs.source_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: packages-*
          path: downloaded-artifacts

      - name: Download debug symbol artifacts
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ inputs.source_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: debug-symbols-*
          path: downloaded-artifacts

      - name: Show downloaded artifact tree
        run: |
          if command -v tree >/dev/null 2>&1; then
            tree downloaded-artifacts
          else
            find downloaded-artifacts -print | sort
          fi

      - name: Normalize downloaded package artifacts
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/src/build/packages"
          mkdir -p "$GITHUB_WORKSPACE/src/build/packages/openwrt" \
                   "$GITHUB_WORKSPACE/src/build/packages/openwrt-debug" \
                   "$GITHUB_WORKSPACE/src/build/packages/keenetic" \
                   "$GITHUB_WORKSPACE/src/build/packages/keenetic-debug" \
                   "$GITHUB_WORKSPACE/src/build/packages/debian"

          shopt -s nullglob

          for artifact_dir in "$GITHUB_WORKSPACE"/downloaded-artifacts/packages-openwrt-*; do
            cp -a "$artifact_dir"/. "$GITHUB_WORKSPACE/src/build/packages/openwrt"/
          done

          for artifact_dir in "$GITHUB_WORKSPACE"/downloaded-artifacts/debug-symbols-openwrt-*; do
            cp -a "$artifact_dir"/. "$GITHUB_WORKSPACE/src/build/packages/openwrt-debug"/
          done

          for artifact_dir in "$GITHUB_WORKSPACE"/downloaded-artifacts/packages-keenetic-*; do
            cp -a "$artifact_dir"/. "$GITHUB_WORKSPACE/src/build/packages/keenetic"/
          done

          for artifact_dir in "$GITHUB_WORKSPACE"/downloaded-artifacts/debug-symbols-keenetic-*; do
            cp -a "$artifact_dir"/. "$GITHUB_WORKSPACE/src/build/packages/keenetic-debug"/
          done

          for artifact_dir in "$GITHUB_WORKSPACE"/downloaded-artifacts/packages-debian-*; do
            cp -a "$artifact_dir"/. "$GITHUB_WORKSPACE/src/build/packages/debian"/
          done

      - name: Normalize publish target root
        id: normalized-target-root
        shell: bash
        run: |
          set -euo pipefail

          sanitize_segment() {
            printf '%s' "$1" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9._-]+#-#g; s#-+#-#g; s#(^-+|-+$)##g'
          }

          sanitize_path() {
            local raw="$1"
            local out=""
            local part=""
            local IFS='/'
            read -ra parts <<< "$raw"
            for part in "${parts[@]}"; do
              [ -z "$part" ] && continue
              part="$(sanitize_segment "$part")"
              [ -z "$part" ] && continue
              if [ -z "$out" ]; then
                out="$part"
              else
                out="$out/$part"
              fi
            done
            printf '%s' "$out"
          }

          normalized_target_root="$(sanitize_path "${{ inputs.target_root }}")"
          if [ -z "$normalized_target_root" ]; then
            echo "target_root resolved to an empty path" >&2
            exit 1
          fi

          echo "value=$normalized_target_root" >> "$GITHUB_OUTPUT"

      - name: Checkout publish repository
        env:
          PUBLISH_REPOSITORY_TOKEN: ${{ secrets.publish_repository_token || secrets.PUBLISH_REPOSITORY_TOKEN }}
        run: |
          set -euo pipefail
          : "${PUBLISH_REPOSITORY_TOKEN:?publish_repository_token or PUBLISH_REPOSITORY_TOKEN secret is required}"
          git clone --branch main --depth=1 --filter=blob:none --sparse \
            "https://x-access-token:${PUBLISH_REPOSITORY_TOKEN}@github.com/maksimkurb/keen-pbr-repository.git" \
            "$GITHUB_WORKSPACE/publish"
          git -C "$GITHUB_WORKSPACE/publish" sparse-checkout set \
            "assets" \
            "keys" \
            "repository/${{ steps.normalized-target-root.outputs.value }}"

      - name: Publish package tree
        run: |
          REPO_SOURCE_REF_TYPE="${{ inputs.source_ref_type }}" \
          REPO_SOURCE_REF_NAME="${{ inputs.source_ref_name }}" \
          REPO_SOURCE_PR_NUMBER="${{ inputs.source_pr_number }}" \
          make -C "$GITHUB_WORKSPACE/src" build-repository \
            REPO_DIR="$GITHUB_WORKSPACE/publish" \
            REPO_TARGET_ROOT="repository/${{ steps.normalized-target-root.outputs.value }}"

      - name: Commit and push repository changes
        working-directory: publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000

          app_version="$("$GITHUB_WORKSPACE/src/build_scripts/resolve-version.sh" full "$GITHUB_WORKSPACE/src")"

          commit_and_push() {
            local msg="$1"
            if ! git diff --cached --quiet; then
              git commit -m "$msg"
              for i in 1 2 3 4 5; do
                if git push origin HEAD:main; then
                  return 0
                fi
                echo "Push failed, retrying in 5 seconds..."
                git pull --rebase origin main || true
                sleep 5
              done
              echo "Failed to push after multiple attempts."
              return 1
            fi
            return 0
          }

          # 1. Assets and Keys
          git add assets keys 2>/dev/null || true
          commit_and_push "publish repository tree (assets/keys) for ${GITHUB_SHA} (${app_version})"

          # 2. Chunk by OS and version
          TARGET_ROOT="repository/${{ steps.normalized-target-root.outputs.value }}"
          if [ -d "$TARGET_ROOT" ]; then
            for os_dir in "$TARGET_ROOT"/*; do
              if [ -d "$os_dir" ]; then
                for version_dir in "$os_dir"/*; do
                  if [ -d "$version_dir" ]; then
                    git add --all "$version_dir"
                    commit_and_push "publish repository tree ($(basename "$os_dir")/$(basename "$version_dir")) for ${GITHUB_SHA} (${app_version})"
                  fi
                done
                # Commit any remaining files in os_dir
                git add --all "$os_dir"
                commit_and_push "publish repository tree ($(basename "$os_dir")) for ${GITHUB_SHA} (${app_version})"
              fi
            done
          fi

          # 3. Catch all remaining files
          git add --all
          if ! git diff --cached --quiet; then
            commit_and_push "publish repository tree (misc) for ${GITHUB_SHA} (${app_version})"
          else
            echo "No further repository updates to publish"
          fi
