{{ if .Params.custom_css }}
  <style>
    {{ .Params.custom_css | safeCSS }}
  </style>
{{ end }}
{{ if .HasShortcode "compare" }}
  {{- $compare := resources.Get "js/compare.js" | minify | fingerprint -}}
  <script src="{{ $compare.RelPermalink }}" integrity="{{ $compare.Data.Integrity }}" defer></script>
{{ end }}
