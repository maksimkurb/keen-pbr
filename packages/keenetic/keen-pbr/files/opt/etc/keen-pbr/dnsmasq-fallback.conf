# Fallback upstream DNS servers for dnsmasq.
# With the dnsmasq upstream integration, dnsmasq.sh (the conf-script) prints
# these servers only while keen-pbr is not running or its config cannot be
# read.  On upgrade they are written into /opt/etc/dnsmasq.conf (in a marked
# block) only when dnsmasq would otherwise have no upstream at all.

server=8.8.8.8
server=8.8.4.4
